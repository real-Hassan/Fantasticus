<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit | The Lore Archive</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-animated"></div>
    <header class="glass-header">
        <div class="logo">Arda & Beyond 🗿</div>
        <nav>
            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
            <ul id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Lore</a></li>
                <li><a href="gallery.html">Artifacts</a></li>
                <li><a href="contact.html" class="active">Submit</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="glass-panel fade-in form-container">
            <h2>Submit a Missing Lore Entry</h2>
            <p>Contribute your knowledge of Middle-earth or the Wizarding World.</p>
            <form id="loreForm" novalidate>
                <div class="input-group">
                    <label for="scholarName">Your Scholar Name:</label>
                    <input type="text" id="scholarName" placeholder="e.g. Elrond or Hermione">
                    <span id="nameError" class="error-msg">A name is required to submit lore.</span>
                </div>
                <div class="input-group">
                    <label for="loreEntry">The Lore / Legend:</label>
                    <textarea id="loreEntry" rows="5" placeholder="Transcribe the history here..."></textarea>
                    <span id="loreError" class="error-msg">The archives cannot accept empty scrolls.</span>
                </div>
                <button type="submit" class="btn-primary">Submit to Archives</button>
            </form>
            <div id="successMsg" class="success-msg hidden">Lore inscribed successfully!</div>
        </div>
    </main>
    <footer class="glass-footer">
        <p>&copy; 2026 The Lore Archive.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
